name: ${COMPOSE_PROJECT_NAME:-gallery}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gallery
      POSTGRES_USER: gallery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gallery", "-d", "gallery"]
      interval: 5s
      retries: 20

  # One-shot: applies drizzle/*.sql, then web starts.
  migrate:
    image: ghcr.io/nycu-winlab/gallery:${GALLERY_VERSION:-main}
    command: ["node", "migrate.mjs"]
    environment:
      DATABASE_URL: postgres://gallery:${POSTGRES_PASSWORD}@postgres:5432/gallery
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/nycu-winlab/gallery:${GALLERY_VERSION:-main}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://gallery:${POSTGRES_PASSWORD}@postgres:5432/gallery
    volumes:
      - cache:/data/cache
    ports:
      - ${GALLERY_BIND:-127.0.0.1}:${GALLERY_PORT:-3000}:3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/.well-known/oauth-protected-resource').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))
      interval: 10s
      retries: 10

  # Search by meaning (EmbeddingGemma 2 on CPU, about 3 GB of memory).
  # Starts with COMPOSE_PROFILES=search; set EMBED_URL=http://embed:8000 to
  # use it. Without it, search matches names only.
  embed:
    image: ghcr.io/nycu-winlab/gallery-embed:${GALLERY_VERSION:-main}
    profiles: [search]
    restart: unless-stopped
    environment:
      EMBED_THREADS: ${EMBED_THREADS:-2}
    volumes:
      - models:/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/')
      interval: 10s
      start_period: 600s
      retries: 10

volumes:
  postgres:
  # thumb and large, copied from Nextcloud on first view; safe to delete.
  cache:
  # The embedding model, downloaded on first start.
  models:
